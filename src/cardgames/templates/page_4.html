<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Winner</title>
        
        <!-- <link rel="icon" type="image/png" sizes="32x32" href="./card.png"> -->
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='card.png') }}">

        <!-- <link rel="stylesheet" href="card_styles.css"> -->
        <link rel="stylesheet" href="{{ url_for('static', filename='card_styles.css') }}">
    </head>

    <body>
        <header>
            <h1>Heart Attack</h1>
        </header>

        <main>
            <article>
                <section class="panel form-panel win-panel">
                    <h2>Winner</h2>

                    <div class="win-announcement">
                        <p>Congratulations!</p>
                        <h1>{{ winner.name }}</h1>
                    </div>

                    <p class="panel-content win-result">
                        {{ winner.name }} has won the game.
                    </p>

                    <div class="action-zone">
                        <a href="https://youtu.be/dQw4w9WgXcQ" target="_blank" class="button button-primary button-large">
                            Home Page
                        </a>
                    </div>

                    <div class="action-zone secret-home-zone">
                        <a id="invisible-button" href="{{ url_for('home') }}" class="button button-secondary button-large">
                            Real Home Page
                        </a>
                    </div>
                </section>
            </article>
        </main>

        <audio id="sfx" preload="auto" src="{{ url_for('static', filename='sfx/weeeee.mp3') }}"></audio>

        <script>
            window.addEventListener("load", () => {
                const effect = document.getElementById('sfx');
                // effect.play();
                effect.play().catch(err => console.log("Audio blocked:", err));
            });
        </script>

    </body>
</html>
