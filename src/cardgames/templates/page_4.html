<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Winner</title>

    <body>
        <header>
            <h1>Heart Attack</h1>
        </header>

        <main>
            <article>
                <section class="panel form-panel win-panel">

                    <p class="panel-content win-result">

                    </p>

                    <div class="action-zone">
                        <a href="https://youtu.be/dQw4w9WgXcQ" target="_blank" class="button button-primary button-large">
                            Home Page
                        </a>
                    </div>

                    <div class="action-zone secret-home-zone">
                        <a id="invisible_button" href="{{ url_for('home') }}" class="button button-secondary button-large">
                            Real Home Page
                        </a>
                    </div>
                </section>
            </article>
        </main>
