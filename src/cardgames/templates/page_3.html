<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Attack</title>
        
    <!-- <link rel="icon" type="image/png" sizes="32x32" href="./card.png"> -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='card.png') }}">

    <style>
        .card-container {
            position: relative;
            display: inline-block;
        }

        .card-container pre {
            margin: 0;
        }

        .slap-button {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- display the current rank of the global card counter -->
    <p>Card to Match: {{ rank }}</p>

    <!-- display current player's name -->
    <p>Current Player: {{ current_player }}</p>

    <div class="card-container">
        <pre>{{ card }}</pre>


        <form method="POST" action="/slap" onsubmit="return handleSlap(this);">
            <button id="slap-button" type="submit"></button>
        </form>
    </div>

    <form method="POST" action="/game">
        <button id="play-card-button" type="submit">
            Play Card
        </button>
    </form>

    <script>
        const play_card_button = document.getElementById("play-card-button");

        function handleSlap(form) {
            // Disable this player's slap button immediately
            const slap_button = document.getElementById("slap-button");
            slap_button.disabled = true;

            // Disable this player's play_card button immediately too
            play_card_button.disabled = true;

            return true;
        }
    </script>

</body>
</html>
