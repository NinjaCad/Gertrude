<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Attack</title>
        
    <!-- <link rel="icon" type="image/png" sizes="32x32" href="./card.png"> -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='card.png') }}">

    <style>
        .card-container {
            position: relative;
            display: inline-block;
        }

        .card-container pre {
            margin: 0;
        }

        .slap-button {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- display the current rank of the global card counter -->
    <p>Card to Match: <span id ="match-rank-val">{{ rank }}</span></p>

    <!-- display current player's name -->
    <p>Current Player: <span id="current-player-val">{{ current_player }}</span></p>

    <div class="card-container">
        <pre id="ascii-display">{{ card }}</pre>


        <form method="POST" action="/slap" onsubmit="return handleSlap(this);">
            <input type="hidden" name="timestamp" id="ts">
            <button id = "slap-btn" class="slap-button" type="submit" disabled></button>
        </form>
    </div>

    <form method="POST" action="/game">

        <!-- Logic to disable to play card button if it's not the player's turn -->
        <button id="play-card-btn" type="submit"
            {% if session['name'] != current_turn_name %} disabled title ="Not Yet" {% endif %}>
            {% if session['name'] == current_turn_name %} Play Card {% else %} Wait {% endif %}
        </button>
    </form>

    <script>
        const playCardBtn = document.getElementById("play-card-btn");
        const slapBtn = document.getElementById("slap-btn");
        const asciiDisplay = document.getElementById("ascii-display");
        const matchRankDisplay = document.getElementById("match-rank-val");
        const currentPlayerDisplay = document.getElementById("current-player-val");
        const myName = "{{ session['name'] }}";

        const source = new EventSource("/game-sync-stream");

        source.onmessage = function(passes) {
            const data = JSON.parse(passes.data);
            
            asciiDisplay.innerText = data.last_card_art;
            matchRankDisplay.innerText = data.match_rank;
            currentPlayerDisplay.innerText = data.current_turn_name;

            // logic for buttons
            if (data.slap_in_progress) {
                playCardBtn.disabled = true;
                playCardBtn.innerText = "SLAPPING...";
                slapBtn.disabled = false;
            } else {
                if (data.current_card_value){
                    slapBtn.disabled = false;
                }
                else{
                    slapBtn.disabled = true;
                }
                if (data.current_turn_name === myName) {
                    playCardBtn.disabled = false;
                    playCardBtn.innerText = "Play Card";
                } else {
                    playCardBtn.disabled = true;
                    playCardBtn.innerText = "Wait";
                }
            }
        };

        source.onerror = function(){
            console.error("EventSource error");
            source.close();
        };

        function handleSlap(form) {

            event.preventDefault();

            // Set timestamp
            document.getElementById("ts").value = Date.now();
            // Disable this player's slap button immediately
            slapBtn.disabled = true;
            // Disable this player's play_card button immediately too
            playCardBtn.disabled = true;

            fetch("/slap", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "timestamp=" + document.getElementById("ts").value
            }).catch(err => console.error("Slap error:", err));

            return false;

        }
    </script>
            

</body>
</html>
